name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build and validation dependencies
        run: pip install -r requirements.txt
      - name: Install locked browser test dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build complete static site atomically
        run: python scripts/build_all.py
      - name: Validate source content and site
        run: |
          python scripts/test_interpretation_parser.py
          python scripts/audit_content.py
          python scripts/validate_display_text.py
          python scripts/validate_interpretation_metadata.py
          python scripts/validate_interpretation_decisions.py
          python scripts/validate_index_quality.py
          python scripts/validate_navigation_targets.py
          python scripts/validate_page_rendering.py
          python scripts/validate_visual_theme.py
          python scripts/validate_search_experience.py
          python scripts/validate_ux_structure.py
          python scripts/validate_site.py
          python scripts/audit_task_search_quality.py
      - name: Test browser search core
        run: |
          node scripts/test_search_core.cjs
          node scripts/test_task_search_semantics.cjs
      - name: Benchmark browser search core
        run: node scripts/benchmark_search_core.cjs
      - name: Verify reproducible atomic builds
        run: python scripts/test_build_reproducibility.py
      - name: Verify all validator mutations are caught
        run: python scripts/test_validator_mutations.py
      - name: Start local server and run Playwright Chromium
        run: npx playwright test
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
